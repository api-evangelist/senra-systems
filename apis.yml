name: Senra Systems
description: >-
  Senra Systems is an aerospace wire harness manufacturer based in Redondo Beach,
  California, that unites design, data, and production under one roof. The company
  builds complex electrical wire harnesses for aerospace and defense programs,
  spanning wire harness design and engineering support, prototype through
  full-rate production, component selection and supply chain optimization, and
  precision automation in a 15,000 square foot smart-manufacturing facility.
  Senra positions itself as delivering harnesses at roughly four times the speed
  of traditional vendors while maintaining aerospace-grade quality and
  certifications. Senra Systems is backed by Sequoia Capital, Andreessen
  Horowitz, Founders Fund, 8VC, and General Catalyst. The company does not
  currently publish a public API, developer portal, or SDKs.
